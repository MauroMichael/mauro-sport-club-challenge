services:
  backend:
    build:
      context: ./backend
    container_name: sportclub-backend
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: sportclub-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"